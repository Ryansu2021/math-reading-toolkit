<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>數學閱讀理解工具包</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Overpass:wght@700;800;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 沿用「門檻」的道路標誌系統。左邊綠色指示牌是題目路線，右邊每一題都走同一個框架：任務列 → 五步條 → 題目卷＋操作牌 → 回饋列。
   Color: 路面灰、標誌白、墨黑、指示綠、禁制紅（問的量）、資訊藍（條件）、觀光棕（資料）、警告黃（目前位置）。 */
:root{
  --road:#DCDFDB; --road-2:#CDD1CC; --plate:#FFFFFF; --paper:#FBFBF8; --ink:#131416; --ink-2:#4A4E54; --ink-3:#8B9096; --line:#C4C8C3;
  --guide:#0A6A4A; --guide-fg:#FFFFFF; --guide-mut:#B9E2CF; --guide-dim:#2D7E62;
  --reg:#D2231C; --warn:#F5C300; --info:#1D5BAA; --tour:#8B4A1C; --ok:#0B8E59; --ok-bg:#DDF2E7; --no-bg:#FBE3E1; --mid-bg:#FFF4C7;
  --on-warn:#131416; --pole:#131416; --pole-fg:#F4F5F3; --pole-line:#3D4247; --pole-mut:#A9AEB4; --scrim:rgba(19,20,22,.55);
  --f-cn:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Overpass","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --road:#16181B; --road-2:#22262A; --plate:#24272C; --paper:#2A2D32; --ink:#EEF0F2; --ink-2:#B4B9C0; --ink-3:#737980; --line:#3A3F45;
  --guide:#0A5A3F; --guide-fg:#F1FFF8; --guide-mut:#9ED3BB; --guide-dim:#1D6E52;
  --reg:#FF4C43; --warn:#FFD21C; --info:#5B97E8; --tour:#CF8650; --ok:#33C98A; --ok-bg:#163A2A; --no-bg:#3E1E1D; --mid-bg:#3A3315;
  --on-warn:#131416; --pole:#0B0C0E; --pole-fg:#EEF0F2; --pole-line:#30353A; --pole-mut:#8D939A; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --road:#16181B; --road-2:#22262A; --plate:#24272C; --paper:#2A2D32; --ink:#EEF0F2; --ink-2:#B4B9C0; --ink-3:#737980; --line:#3A3F45;
  --guide:#0A5A3F; --guide-fg:#F1FFF8; --guide-mut:#9ED3BB; --guide-dim:#1D6E52;
  --reg:#FF4C43; --warn:#FFD21C; --info:#5B97E8; --tour:#CF8650; --ok:#33C98A; --ok-bg:#163A2A; --no-bg:#3E1E1D; --mid-bg:#3A3315;
  --on-warn:#131416; --pole:#0B0C0E; --pole-fg:#EEF0F2; --pole-line:#30353A; --pole-mut:#8D939A; --scrim:rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--pole);color:var(--ink);font-family:var(--f-cn);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#vp{position:fixed;inset:0;overflow:hidden;background:var(--pole)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--road);overflow:hidden;display:grid;
  grid-template-columns:330px 1fr;grid-template-rows:72px 1fr;grid-template-areas:"top top" "route work"}
#stage.portrait{grid-template-columns:1fr;grid-template-rows:72px auto 1fr;grid-template-areas:"top" "route" "work"}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
em{font-style:normal;background:var(--warn);color:var(--on-warn);padding:0 5px;border-radius:3px}

/* 路標桿 */
.top{grid-area:top;background:var(--pole);color:var(--pole-fg);display:flex;align-items:center;gap:16px;padding:0 20px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.disc{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 6px #D2231C;display:grid;place-items:center;font-weight:900;font-size:22px;color:#131416}
.brand b{font-size:27px;font-weight:900;letter-spacing:.14em;line-height:1}
.brand small{display:block;font-size:12.5px;color:var(--pole-mut);letter-spacing:.04em;margin-top:5px;font-weight:500}
.overall{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:14px;color:var(--pole-mut);font-weight:700}
.overall .bar{display:flex;gap:4px}
.overall .bar i{width:30px;height:10px;border-radius:2px;background:var(--pole-line)}
.overall .bar i.on{background:var(--warn)}
.ibtn{height:40px;min-width:40px;padding:0 12px;border:2px solid var(--pole-line);border-radius:6px;background:none;color:var(--pole-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.ibtn.on{border-color:var(--warn);color:var(--warn)}
#stage.portrait .brand small,#stage.portrait .overall>span{display:none}

/* 左：題目路線 */
.route{grid-area:route;background:var(--guide);color:var(--guide-fg);margin:16px 0 16px 16px;border-radius:14px;box-shadow:inset 0 0 0 5px var(--guide),inset 0 0 0 8px var(--guide-fg);
  padding:20px 18px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
#stage.portrait .route{margin:14px 14px 0;padding:12px 14px}
.route h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--guide-mut)}
#stage.portrait .route h2,#stage.portrait .take{display:none}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#stage.portrait .legs{flex-direction:row;flex-wrap:wrap}
#stage.portrait .legs li{flex:1 1 24%}
.leg{display:grid;grid-template-columns:46px 1fr;gap:11px;align-items:center;background:none;border:0;padding:6px 8px 6px 0;border-radius:10px;text-align:left;width:100%;color:var(--guide-fg)}
#stage.portrait .leg{grid-template-columns:40px 1fr;gap:8px;padding:5px 4px}
.leg .no{width:46px;height:46px;border-radius:8px;background:var(--warn);color:var(--on-warn);display:grid;place-items:center;font-family:var(--f-num);font-weight:900;font-size:22px;line-height:1}
#stage.portrait .leg .no{width:40px;height:40px;font-size:19px}
.leg .no.fw{background:var(--guide-fg);color:var(--guide);font-family:var(--f-cn);font-size:17px}
.leg.on{background:var(--guide-dim)}
.leg.on .no{box-shadow:0 0 0 3px var(--guide-fg)}
.leg .nm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;line-height:1.25}
.leg .sub{display:block;font-size:12.5px;color:var(--guide-mut);margin-top:2px;font-weight:500}
#stage.portrait .leg .sub{display:none}
.leg .dots{display:flex;gap:4px;margin-top:5px}
.leg .dots i{width:16px;height:5px;border-radius:2px;background:var(--guide-dim)}
.leg.on .dots i{background:var(--guide)}
.leg .dots i.on{background:var(--warn)}
.badge{font-size:11px;font-weight:900;background:var(--guide-fg);color:var(--guide);padding:2px 6px;border-radius:3px;letter-spacing:.06em}
.take{margin-top:auto;background:var(--guide-dim);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6}
.take .cap{font-size:12px;color:var(--guide-mut);font-weight:700;letter-spacing:.1em;margin-bottom:4px}

/* 右：工作區 */
.work{grid-area:work;display:flex;flex-direction:column;gap:12px;padding:16px;min-height:0;min-width:0}
.mission{display:flex;align-items:center;gap:14px;background:var(--plate);border-radius:10px;padding:12px 16px;box-shadow:inset 0 0 0 2px var(--line)}
.mission .ex{flex:none;background:var(--ink);color:var(--plate);font-weight:900;font-size:14px;padding:6px 10px;border-radius:5px;letter-spacing:.06em}
.mission .say{font-size:20px;font-weight:700;line-height:1.5;flex:1;min-width:0}
.mission .src{flex:none;font-size:13px;color:var(--ink-3);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{display:flex;align-items:center;gap:10px;background:var(--road-2);border-radius:8px;padding:8px 12px;font-size:16px;font-weight:700;color:var(--ink-2)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--plate);font-family:var(--f-num);font-weight:900;font-size:15px;flex:none}
.step.done{background:var(--ok-bg);color:var(--ok)}
.step.done .n{background:var(--ok);color:var(--plate)}
.step.cur{background:var(--warn);color:var(--on-warn)}
.step.cur .n{background:var(--ink);color:var(--warn)}
#stage.portrait .step{flex-direction:column;gap:4px;padding:6px 4px;font-size:14px;text-align:center}

.stagebox{flex:1;min-height:0;display:grid;grid-template-columns:1fr 470px;gap:14px}
#stage.portrait .stagebox{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.sheet{background:var(--paper);border-radius:4px;box-shadow:0 0 0 1.5px var(--line),0 6px 0 -2px var(--road-2);padding:22px 28px;min-height:0;overflow:auto}
#stage.portrait .sheet{max-height:640px}
.qno{font-weight:900;font-size:16px;color:var(--ink-2);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.qno span{border:2px solid var(--ink-2);border-radius:4px;width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-num)}
.passage{font-size:22px;line-height:2.25;letter-spacing:.02em}
.passage p{margin:4px 0}
.ptab{border-collapse:collapse;margin:8px 0 10px;font-size:19px;line-height:1.5}
.ptab th,.ptab td{border:1.5px solid var(--ink);padding:6px 12px;text-align:center}
.ptab th{background:var(--road);font-size:16px}
.chunk{padding:2px 1px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tapping .chunk{cursor:pointer}
.tapping .chunk:hover{background:var(--mid-bg)}
.chunk.m-ask{box-shadow:0 0 0 3px var(--reg);border-radius:999px;padding:2px 8px}
.chunk.m-cond{text-decoration:underline;text-decoration-color:var(--info);text-decoration-thickness:4px;text-underline-offset:7px}
.chunk.m-data{box-shadow:inset 0 0 0 2.5px var(--tour);border-radius:3px;padding:1px 4px}
.chunk.m-noise{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:2.5px;color:var(--ink-3)}
.chunk.shake{animation:shake .35s;background:var(--no-bg)}
@keyframes shake{25%{background:var(--no-bg);transform:translateX(-2px)}75%{background:transparent;transform:translateX(2px)}}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mk{display:inline-block;width:30px;height:18px;flex:none}
.mk.ask{box-shadow:0 0 0 3px var(--reg);border-radius:999px}
.mk.cond{border-bottom:4px solid var(--info);height:12px}
.mk.data{box-shadow:inset 0 0 0 2.5px var(--tour);border-radius:3px}
.mk.noise{height:2.5px;background:var(--ink-3)}
.diag{margin-top:14px;border-top:2px dashed var(--line);padding-top:10px}
.diag .cap{font-size:13px;font-weight:900;color:var(--ink-2);letter-spacing:.06em}
.diag svg{width:100%;max-width:660px;height:auto;display:block}

.side{position:relative;background:var(--plate);border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.side.focus{box-shadow:inset 0 0 0 3px var(--warn)}
.ptl{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--ink-2)}
.qq{font-size:19px;font-weight:900;line-height:1.5}
.hint{display:flex;flex-direction:column;gap:10px}
.hint .hh{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900}
.hint .hw{font-size:15px;color:var(--ink-2);line-height:1.65}
.goL{font-size:16px;font-weight:900;color:var(--info)}
.cnt2{font-size:15px;font-weight:700;color:var(--ink-2)}
.cnt2 b{font-family:var(--f-num);font-size:20px;color:var(--ink)}
.mini{background:var(--road);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.65}
.mini b{display:block;font-size:13px;letter-spacing:.06em;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--road);border:0;border-radius:8px;padding:10px 14px;font-weight:800;font-size:18px;line-height:1.45;box-shadow:inset 0 0 0 2px var(--line)}
.opt:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.opt.no{background:var(--no-bg);box-shadow:inset 0 0 0 2px var(--reg)}
.opt .pc{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:2px}
.tbadge{align-self:flex-start;background:var(--info);color:#fff;font-weight:900;font-size:14px;padding:4px 10px;border-radius:4px}
.rt{border-collapse:collapse;width:100%;font-size:14px}
.rt th,.rt td{border:2px solid var(--ink);padding:4px 7px;text-align:left;vertical-align:middle;line-height:1.4}
.rt thead th{background:var(--road);font-size:13px}
.rt td.v{font-family:var(--f-num);font-weight:800;font-size:16px;text-align:center;white-space:nowrap}
.rt td.h{font-size:13px;color:var(--ink-2)}
.rt tr.tg th{color:var(--reg)}
.rt tr.lm th{color:var(--info)}
.rt .fill{color:var(--ok)}
.rt .ask{background:var(--warn);color:var(--on-warn);padding:0 8px;border-radius:3px}
.rt .q2{color:var(--ink-3)}
.rt tr.miss td,.rt tr.miss th{background:var(--no-bg)}
.rt tr.miss th{box-shadow:inset 4px 0 0 var(--reg)}
.misslab{font-size:13px;font-weight:900;color:var(--reg)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;border-top:2px solid var(--line);padding-top:10px;margin-top:auto}
.log div{display:grid;grid-template-columns:20px 1fr;gap:8px}
.log b{font-family:var(--f-num);color:var(--ok)}

.checkbar{display:flex;align-items:center;gap:14px;min-height:58px;background:var(--plate);border-radius:10px;padding:10px 16px;box-shadow:inset 0 0 0 2px var(--line)}
.msg{flex:1;font-size:17px;font-weight:700;line-height:1.5}
.msg small{font-size:14px;color:var(--ink-3);font-weight:500}
.msg .good{color:var(--ok)}.msg .bad{color:var(--reg)}.msg .mid{color:var(--ink-2)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:900;font-size:17px}
.btn.go{background:var(--ink);color:var(--plate)}
.btn.alt{background:var(--road);box-shadow:inset 0 0 0 2px var(--line)}

/* 框架總覽 */
.ov{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-content:start}
#stage.portrait .ov{grid-template-columns:1fr}
.card{background:var(--plate);border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);padding:18px 20px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.1em;color:var(--ink-2);font-weight:900}
.thesis{font-size:30px;font-weight:900;line-height:1.35;text-wrap:balance;margin:0 0 6px}
.thesis span{color:var(--reg)}
.lead{font-size:15.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.bars{display:grid;grid-template-columns:96px 1fr 54px;gap:6px 10px;align-items:center;font-size:14px}
.bars .tr{height:16px;background:var(--road);border-radius:3px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--ink-3)}
.bars .hot .tr i{background:var(--reg)}
.bars .v{font-family:var(--f-num);font-weight:800;text-align:right}
.bars .hot{font-weight:900}
.srcn{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.five{display:flex;flex-direction:column;gap:8px}
.five .r{display:grid;grid-template-columns:34px 1fr 40px;gap:12px;align-items:center;background:var(--road);border-radius:8px;padding:9px 12px}
.five .r.key{background:var(--mid-bg);box-shadow:inset 0 0 0 2px var(--warn)}
.five .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--plate);display:grid;place-items:center;font-weight:900;font-family:var(--f-num)}
.five .t{font-size:18px;font-weight:900}
.five .d{font-size:14px;color:var(--ink-2);line-height:1.5}
.loop{font-size:13.5px;color:var(--ink-2);margin-top:8px}
.rules{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.rules li{font-size:15px;line-height:1.6}
.rules b{display:block;font-size:16.5px}
.tools{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#stage.portrait .tools{grid-template-columns:1fr}
.tt{border-collapse:collapse;width:100%;font-size:14.5px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
.tt td:last-child{font-family:var(--f-num);font-weight:800;white-space:nowrap}
.ql{margin:0;padding-left:20px;font-size:15px;line-height:1.75}
.start{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* 完成 */
.pass{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:10}
.passcard{width:min(660px,90%);background:var(--plate);border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 6px var(--guide)}
.stamp{align-self:flex-start;background:var(--guide);color:var(--guide-fg);font-weight:900;font-size:22px;padding:8px 16px;border-radius:6px;letter-spacing:.08em}
.passcard .tk{font-size:18px;line-height:1.7}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- v2：讀題四問、需求樹、記號旁寫字、三種模式 ---- */
.seg{display:inline-flex;border:2px solid var(--pole-line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--pole-mut);font-weight:700;font-size:14px;padding:0 12px;height:36px}
.seg button.on{background:var(--warn);color:var(--on-warn)}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.q4 div{display:flex;align-items:center;gap:8px;background:var(--plate);border-radius:8px;padding:6px 10px;font-size:14.5px;font-weight:700;color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line)}
.q4 div b{font-family:var(--f-num);font-size:13px;background:var(--road);color:var(--ink-2);border-radius:4px;padding:1px 6px;flex:none}
.q4 div.on{color:var(--ink);box-shadow:inset 0 0 0 3px var(--info);background:var(--plate)}
.q4 div.on b{background:var(--info);color:#fff}
#stage.portrait .q4 div{font-size:13px;padding:5px 6px}
.chip{display:inline-block;font-size:13px;font-weight:900;line-height:1.3;padding:1px 6px;border-radius:4px;margin:0 4px 0 2px;vertical-align:4px;letter-spacing:0;white-space:nowrap}
.chip.c-a{background:var(--no-bg);color:var(--reg)}
.chip.c-d{background:var(--mid-bg);color:var(--tour)}
.chip.c-c{background:var(--road);color:var(--info);box-shadow:inset 0 0 0 1.5px var(--info)}
.chip.c-n{background:var(--road);color:var(--ink-3)}
.chunk.newmark{animation:pop .7s ease-out}
@keyframes pop{0%{background:var(--warn)}100%{background:transparent}}
.chunk.focusn{animation:blink 1.2s ease-in-out infinite;border-radius:4px}
@keyframes blink{0%,100%{background:transparent}50%{background:var(--mid-bg)}}
.ptab td .chip{vertical-align:2px}
.think{background:var(--ok-bg);border-radius:10px;padding:10px 14px;font-size:15.5px;line-height:1.7;position:relative}
.think b{display:block;font-size:12.5px;letter-spacing:.1em;color:var(--ok);margin-bottom:2px}
.demo{align-self:flex-start;background:var(--ok);color:#fff}
.tree{background:var(--road);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tree .goal{font-weight:900;font-size:15px;color:var(--reg)}
.tree .eq{font-weight:700;color:var(--ink-2);font-size:13.5px}
.tree .parts{display:grid;gap:6px}
.tree .tp{background:var(--plate);border-radius:8px;padding:6px 10px}
.tree .tp>b{font-size:14px}
.tree ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}

  while((m=re.exec(str))){ if(m.index>last) plain(str.slice(last,m.index)); const s={t:m[3],k:m[1],key:m[2]||(m[1]==='a'?'ask':null),chip:m[4]||'',id:P.all.length}; P.all.push(s); out.push(s); last=re.lastIndex; }

function go(ph){ const p=cur(); p.wrong=null;
  if(md()==='self'&&PICK[ph]&&(ph==='follow'||!p.picked[ph])){ p.phase='pick'; p.pickT=PICK[ph]; p.pickNext=ph; return; }

function enterSlot(){ const p=cur(),P=CP(),s=P.need.slots[p.si]; p.got=[];

function segHTML(s,p,o){
  const c=[]; let chip='';
  if(s.k==='a'&&p.ask){ c.push('m-ask'); chip=`<span class="chip c-a">${s.chip}</span>`; }
  if(s.key&&p.mk[s.key]){ c.push(s.k==='c'?'m-cond':'m-data'); chip=`<span class="chip ${s.k==='c'?'c-c':'c-d'}">${s.chip}</span>`; }
  if(s.key&&p.st[s.key]){ c.push('m-noise'); chip=`<span class="chip c-n">劃掉：${o.short(s.key)}</span>`; }
  if(o.focus&&o.focus.includes(s.key)) c.push('focusn');
  if(p.shake===s.id) c.push('shake');
  if(s.key&&p.fresh.includes(s.key)) c.push('newmark');
  if(s.k==='a'&&p.fresh.includes('ask')) c.push('newmark');
  return `<span class="chunk ${c.join(' ')}" data-act="tap" data-v="${s.id}"${o.tap?' role="button" tabindex="0"':''}>${s.t}</span>${chip}`;
}

function tree(P,p){

  if(!splitDone) return `<div class="tree"><div class="goal">★ ${N.goal}</div><div class="eq">往回拆：要算它，要先知道什麼？</div></div>`;
  const parts=N.split.parts.map(pt=>{ const ss=N.slots.map((s,i)=>[s,i]).filter(([s])=>s.part===pt);
    const hide=md()==='self'&&!p.candDone[pt];
    return `<div class="tp"><b>${pt}</b><ul>${hide?'<li><i>？</i><span>要先知道什麼？自己列出來</span></li>':ss.map(([s,i])=>{ const ok=i<p.si||(i===p.si&&(p.phase==='follow'||(p.phase==='pick'&&p.pickNext==='follow')))||stepOf(p)>1; const isCur=i===p.si&&['need','follow'].includes(p.phase);
      return `<li class="${ok?'ok':isCur?'cur':''}"><i>${ok?'✓':isCur?'▶':'·'}</i><span>${s.need}${ok?`<small>　→ ${s.note}</small>`:''}</span></li>`; }).join('')}</ul></div>`; }).join('');
  return `<div class="tree"><div class="goal">★ ${N.goal}</div><div class="eq">${N.split.eq}</div><div class="parts">${parts}</div></div>`;
}

  return `<table class="rt"><thead><tr><th>量（單位）</th><th>數值或式子</th><th>怎麼來的</th></tr></thead><tbody>${P.rel.map((r,i)=>`<tr class="${r.r==='t'?'tg':r.r==='l'?'lm':''}${missRow===i?' miss':''}"><th>${r.r==='t'?'★ ':r.r==='l'?'▲ ':''}${r.n}</th><td class="v">${cell(r.v)}</td><td class="h">${r.h}</td></tr>`).join('')}</tbody></table>`;
}
const opts=(arr,wrongI,pct)=>`<div class="opts">${arr.map((t,i)=>`<button class="opt ${wrongI===i?'no':''}" data-act="opt" data-v="${i}">${t}${pct&&wrongI===i&&pct[i]?`<span class="pc">全國基礎組 ${pct[i]}% 選這個</span>`:''}</button>`).join('')}</div>`;
const demoBtn=()=>md()==='demo'?`<button class="btn demo" data-act="demo">看我怎麼想 ▸</button>`:'';
function candList(P,p,part){ const ss=P.need.slots.filter(s=>s.part===part).map(s=>({t:s.need,s:'need'})); const all=ss.concat(P.need.cands[part]||[]);
  return all.map((c,i)=>[c,i]).sort((a,b)=>((a[0].t.length*7+a[1]*3)%5)-((b[0].t.length*7+b[1]*3)%5)).map(x=>x[0]); }

function probView(i){
  const P=PROBS[i],p=S.P[i],ph=p.phase,M=md(),st=stepOf(p);
  const slot=P.need.slots[p.si];
  let say='',side='';
  const T='';
  if(ph==='pick'){ say='現在，<em>該問自己哪一問</em>？';
    side=`${tree(P,p)}<div class="qq">現在該問自己哪一問？</div><div class="opts">${Q4.map((q,k)=>`<button class="qbtn ${p.wrong===k?'no':''}" data-act="pickq" data-v="${k+1}"><b>問${k+1}</b><span>${q}</span></button>`).join('')}</div>`; }
  else if(ph==='ask'){ say='跳到最後的問句，<em>圈出要求的量</em>。';
    side=`${T}<div class="hint"><div class="hh"><i class="mk ask"></i>問1　問什麼？</div>${M==='self'?'':`<div class="qq">這一題最後要你求什麼？</div><div class="hw">先跳到最後的問句，再往前讀。找出「要求的那個量」，不是題目給的數字。</div>`}<div class="goL">◀ 在題目上點出問的量</div>${demoBtn()}</div>`; }

    side=`${T}<div class="hint"><div class="hh"><i class="mk ask"></i>問1　答案的樣子</div></div><div class="qq">${P.need.shape.q}</div>${opts(P.need.shape.o,p.wrong)}${demoBtn()}`; }
  else if(ph==='split'){ say='從問的量<em>往回拆</em>：要算它，可以拆成哪幾塊？';
    side=`${T}${tree(P,p)}<div class="qq">${P.need.split.q}</div>${opts(P.need.split.o,p.wrong)}${demoBtn()}`; }
  else if(ph==='cands'){ const pt=slot.part; say=`問2：要算「<em>${pt}</em>」，要先知道什麼？自己列出來。`;
    side=`${T}${tree(P,p)}<div class="slot"><span class="pt">${pt}</span><div class="qq">要算「${pt}」，要先知道什麼？選出全部需要的。</div>
      <div class="cands">${candList(P,p,pt).map(c=>`<button class="cand ${p.sel.includes(c.t)?'on':''}" data-act="cand" data-v="${encodeURIComponent(c.t)}">${c.t}</button>`).join('')}</div>
      <button class="btn go" data-act="candok" style="align-self:flex-start">列好了，去題目上找 ◀</button></div>${demoBtn()}`; }
  else if(ph==='need'){ say=M==='self'?`到題目上找：<em>${slot.need}</em>。`:`問2：要算「${slot.part}」，先知道<em>${slot.need}</em>。`;
    side=`${T}${tree(P,p)}<div class="slot"><span class="pt">${slot.part}</span><div class="qq">${M==='self'?'找：'+slot.need:slot.q}</div><div class="goL">◀ 在題目上點出來（${p.got.length} / ${slot.keys.length}）</div></div>${demoBtn()}`; }
  else if(ph==='follow'){ say='問3：這句條件<em>管哪個量</em>？是上限、下限，還是規則？';
    side=`${T}${tree(P,p)}<div class="hint"><div class="hh"><i class="mk cond"></i>問3　條件管誰？</div></div><div class="qq">${slot.follow.q}</div>${opts(slot.follow.o,p.wrong)}${demoBtn()}`; }
  else if(ph==='type'){ say='資料都找到了。先判斷<em>關係類型</em>：比固定、差固定、有上限，還是基準會換？';
    side=`${T}<div class="qq">${P.typeQ.q}</div>${opts(P.typeQ.o,p.wrong)}<div class="mini"><b>關係檢核三問</b>比固定、差固定，還是都不固定？比的是絕對量還是比值？有沒有上限、另一個方案，或單位沒換？</div>${demoBtn()}`; }

  else if(ph==='ans'){ say='<em>回到情境</em>：代數字或比大小，檢查答案合不合理。';
    side=`${T}${relTable(P,p)}<div class="qq">${P.ans.q}</div>${opts(P.ans.o,p.wrong)}${demoBtn()}`; }
  else if(ph==='noise'){ const N=P.need.noise[p.ni],sx=N.steps[p.ns],txt=N.keys.map(k=>P.byKey[k].t).join('、');

    side=`${T}<div class="hint"><div class="hh"><i class="mk noise"></i>問4　真的用不到？</div><div class="hw">關係已經建好了。現在才有根據判斷：這一項到底用不用得到。</div></div><div class="qq">${sx.q}</div>${opts(sx.o,p.wrong)}${demoBtn()}`; }
  else if(ph==='diag'){ say='<em>對比錯例</em>：全國很多人選的錯誤答案，錯在哪一步？';

  else { say='這一題完成了。左邊的題目，就是考試時你在紙上該留下的樣子。';
    side=`<span class="tbadge">${P.type}</span>${relTable(P,p,P.wrong.row)}<div class="misslab">紅色列：選「${P.wrong.pick}」的人（${P.wrong.pct}%）漏掉的關係</div>${tree(P,p)}`; }
  const qOn=ph==='pick'?0:(PHQ[ph]||0);
  const tapOK=['ask','need'].includes(ph);
  const focus=ph==='noise'?P.need.noise[p.ni].keys:null;
  const o={tap:tapOK,focus,short:k=>{const N=P.need.noise.find(n=>n.keys.includes(k)); return N?N.short:'';}};
  const dg=P.diagram&&(PHSTEP[ph]>=2||ph==='done')?diagram(p):'';
  const msg=(M==='demo'&&p.think&&ph!=='done')?`<div class="think"><b>放聲思考</b>${p.think}</div>`:p.msg?`<span class="${p.msg[0]}">${p.msg[1]}</span>`:`<small>${M==='demo'?'按「看我怎麼想」，看一位會讀題的人每一步問自己什麼。也可以自己先試。':M==='guide'?'每一個記號旁邊都會寫字。考試時也在紙上這樣寫。':'網頁不再告訴你要找什麼。先選「現在該問哪一問」，再自己列出需要的資料。'}</small>`;
  const btn=ph==='done'?(i<PROBS.length-1?`<button class="btn go" data-act="ex" data-v="${i+2}">下一題 ▸</button>`:`<button class="btn go" data-act="ex" data-v="7">去紙上挑戰 ▸</button>`):'';
  return `<div class="mission"><span class="ex">第 ${i+1} 題・${MODES[M]}</span><div class="say">${say}</div><span class="src">${P.src}</span></div>
   <div class="steps">${STEPS.map((s,k)=>`<div class="step ${k<st?'done':k===st?'cur':''}"><span class="n">${k<st?'✓':k+1}</span>${s}</div>`).join('')}</div>
   <div class="q4">${Q4S.map((q,k)=>`<div class="${qOn===k+1?'on':''}"><b>問${k+1}</b>${q}</div>`).join('')}</div>
   <div class="stagebox"><div class="sheet"><div class="fitin"><div class="qno"><span>${i+1}</span>${P.title}</div><div class="passage${tapOK?' tapping':''}">${passage(P,p,o)}</div>${dg}${LEG}</div></div>
   <div class="side${ph!=='done'?' focus':''}"><div class="fitin"><div class="ptl">${ph==='done'?'完成':`第 ${st+1} 步・${STEPS[Math.min(st,4)]}`}</div>${side}</div></div></div>
   <div class="checkbar"><div class="msg">${msg}</div>${btn}</div>`;
}

   <div class="checkbar"><div class="msg"><small>專家的讀法不是唯一答案：你的記號和旁註意思一樣就算對。</small></div><button class="btn alt" data-act="ex" data-v="0">回到框架</button></div>`;

function normalize(){ if(!(S.ex>=1&&S.ex<=6)) return; const p=cur(),P=CP();
  if(md()==='self'&&p.phase==='ask'&&!p.ask&&!p.picked.ask){ p.phase='pick'; p.pickT=1; p.pickNext='ask'; }
  if(md()!=='self'&&p.phase==='pick'){ p.phase=p.pickNext; p.wrong=null; if(p.phase==='need') enterSlot(); }
  if(md()!=='self'&&p.phase==='cands'){ p.candDone[P.need.slots[p.si].part]=true; p.phase='need'; p.got=[]; } }
function over(e){ return e&&e.scrollHeight>e.clientHeight+1; }
function autoFitAll(){
  document.querySelectorAll('.sheet,.side,.tile,.ovmb').forEach(box=>{ const inn=box.querySelector('.fitin'); if(!inn) return; let z=1; inn.style.zoom=1; while(over(box)&&z>0.5){ z=Math.round((z-0.04)*100)/100; inn.style.zoom=z; } });
  const ov=document.querySelector('.ov'); if(ov){ let z=1; const bad=()=>over(ov)||[...ov.querySelectorAll('.ovc,.card')].some(over); ov.style.zoom=1; ov.style.height=''; while(bad()&&z>0.6){ z=Math.round((z-0.04)*100)/100; ov.style.zoom=z; ov.style.height=(100/z)+'%'; } }
}

    <div class="tk" style="font-size:15px">紙上這樣寫：圈旁寫「求：＿」、框旁寫「什麼量」、底線旁寫「管誰」、劃掉旁寫理由。</div>
    <div class="row"><button class="btn alt" data-act="close">看我讀過的題目</button>${i<PROBS.length-1?`<button class="btn go" data-act="ex" data-v="${i+2}">下一題・${PROBS[i+1].title}（${MODES[S.mode[i+1]]}）▸</button>`:`<button class="btn go" data-act="ex" data-v="7">去紙上挑戰 ▸</button>`}</div></div></div>`:'';

/* ================= 動作 ================= */
function tap(id){
  const P=CP(),p=cur(),s=P.all[id];
  if(p.phase==='ask'){
    if(s.k==='a'){ p.ask=true; p.fresh.push('ask'); p.msg=['good','圈到了。旁邊寫上「'+s.chip+'」。']; p.think=null; go('shape'); }
    else { p.shake=id; p.msg=['bad',s.k&&s.k!=='a'?'這是題目給的資料，不是要你求的量。先讀最後的問句。':'這一段不是要你求的量。先讀最後的問句。']; }
    return; }
  if(p.phase!=='need') return;
  const sl=P.need.slots[p.si];
  if(s.key&&sl.keys.includes(s.key)){
    if(p.got.includes(s.key)){ p.msg=['mid','這一項已經標過了。']; return; }
    p.got.push(s.key); p.mk[s.key]=true; p.fresh.push(s.key); p.think=null;
    if(p.got.length<sl.keys.length){ p.msg=['good',`對，旁邊寫「${s.chip}」。還差 ${sl.keys.length-p.got.length} 項。`]; return; }
    p.msg=['good',`找到了，旁邊寫「${sl.keys.map(k=>P.byKey[k].chip).join('」「')}」。`]; afterSlotFound(); return; }
  if(s.key&&p.mk[s.key]){ p.msg=['mid','這一項已經標過了，它回答的是前面的問題。']; return; }
  if(s.k==='d'||s.k==='c'){ const o=P.need.slots[P.slotOf[s.key]]; p.msg=['mid',`這一句回答的是另一個問題：「${o.need}」，等一下會用到。現在要找的是「${sl.need}」。`]; return; }
  if(s.k==='n'){ p.msg=['mid',`先別急著決定它有沒有用。現在要找的是「${sl.need}」。這一項，等關係建好以後（第⑤步）再檢查。`]; return; }
  if(s.k==='a'){ p.msg=['mid','這是問的量，已經圈過了。']; return; }
  p.shake=id; p.msg=['bad',`這一段沒有回答「${sl.need}」。${md()==='self'?'':'再讀一次右邊的問題。'}`];
}
function candOK(){
  const P=CP(),p=cur(),pt=P.need.slots[p.si].part, list=candList(P,p,pt);
  const bad=list.filter(c=>c.s==='no'&&p.sel.includes(c.t)), miss=list.filter(c=>c.s==='need'&&!p.sel.includes(c.t)), may=list.filter(c=>c.s==='maybe'&&p.sel.includes(c.t));
  if(bad.length){ p.msg=['bad',`「${bad[0].t}」不需要：${bad[0].w}`]; return; }
  if(miss.length){ p.msg=['bad',`還少了 ${miss.length} 項。想一想：要算「${pt}」，算式裡每一個量從哪裡來？`]; return; }
  p.candDone[pt]=true; p.phase='need'; p.got=[];
  p.msg=['good',`需求列好了。${may.length?may.map(c=>`「${c.t}」：${c.w}`).join(' '):''}`];
}
function choose(v){
  const P=CP(),p=cur(),ph=p.phase;
  const ok=(good,fn)=>{ p.wrong=null; p.msg=['good',good]; fn(); }, no=w=>{ p.wrong=v; p.msg=['bad',w||'再想一想。']; };
  if(ph==='shape'){ const Q=P.need.shape; return v===Q.a?ok(Q.why,()=>go('split')):no(Q.w[v]); }
  if(ph==='split'){ const Q=P.need.split; return v===Q.a?ok('拆好了：'+Q.eq+'。接下來一塊一塊找資料。',()=>{p.si=0; go('need');}):no(Q.w[v]); }
  if(ph==='follow'){ const Q=P.need.slots[p.si].follow; return v===Q.a?ok(`條件讀懂了：${Q.o[Q.a]}。`,()=>nextSlot()):no(Q.w[v]); }
  if(ph==='type') return v===P.typeQ.a?ok(P.typeWhy,()=>{p.phase='calc';p.ci=0;}):no(P.typeQ.w[v]);
  if(ph==='calc'){ const C=P.calc[p.ci]; return v===C.a?ok(p.ci<P.calc.length-1?'對了，填進關係表，下一格。':'關係表填好了。現在把它寫成式子。',()=>{ p.ci++; if(p.ci>=P.calc.length) p.phase='model'; }):no(C.w[v]); }
  if(ph==='model') return v===P.model.a?ok('式子正確。它就是關係表的「★ 第一列」寫成符號。',()=>{p.phase='ans';}):no(P.model.w[v]+(P.model.pct[v]?`（全國基礎組 ${P.model.pct[v]}% 選這個）`:''));
  if(ph==='ans') return v===P.ans.a?ok(P.ans.why,()=>{ p.ni=0;p.ns=0; go('noise'); }):no(P.ans.w[v]);
  if(ph==='noise'){ const N=P.need.noise[p.ni],sx=N.steps[p.ns];
    if(v!==sx.a) return no(sx.w[v]);
    p.wrong=null; p.ns++;
    if(p.ns>=N.steps.length){ const why=finishNoise(); p.msg=['good','可以劃掉了，旁邊寫理由：'+why]; } else p.msg=['good','對。再想下一步。'];
    return; }
  if(ph==='diag') return v===2?ok('對，錯在③找關係。'+P.wrong.why,()=>{p.phase='done';p.done=true;S.pop=true;save();}):no(['他圈的問題沒錯，他求的也是同一個量。','他用到的數字都在題目裡，也都讀對了。','','他的計算本身沒錯，錯在算之前，關係就建錯了。','回情境檢查能發現答案怪怪的，但錯誤更早就發生了。'][v]);
}
function pickQ(v){ const p=cur(); if(v===p.pickT){ p.picked[p.pickNext]=true; p.wrong=null; p.msg=['good',`對，現在問自己：${Q4[v-1]}`]; const nx=p.pickNext; p.phase=nx; if(nx==='need') enterSlot(); }
  else { p.wrong=v-1; p.msg=['bad','不是這一問。'+PICKHINT[p.pickT]]; } }
function demo(){
  const P=CP(),p=cur(),ph=p.phase,sl=P.need.slots[p.si];
  if(ph==='ask'){ const s=P.byKey.ask; p.ask=true; p.fresh.push('ask'); p.think=`我先跳到最後的問句。題目要我求的是「${s.t}」，我把它圈起來，旁邊寫「${s.chip}」。`; p.msg=null; go('shape'); return; }
  if(ph==='shape'){ p.think='答案長什麼樣子？'+P.need.shape.why; p.msg=null; go('split'); return; }
  if(ph==='split'){ p.think=P.need.split.think; p.msg=null; p.si=0; go('need'); return; }
  if(ph==='cands'){ const pt=sl.part; p.sel=P.need.slots.filter(s=>s.part===pt).map(s=>s.need); p.candDone[pt]=true; p.phase='need'; p.got=[]; p.think=`要算「${pt}」，我需要知道：${p.sel.join('、')}。`; p.msg=null; return; }
  if(ph==='need'){ sl.keys.forEach(k=>{p.mk[k]=true;p.fresh.push(k);}); p.think=sl.think+`我把它${sl.keys.some(k=>P.byKey[k].k==='c')?'畫上底線':'框起來'}，旁邊寫「${sl.keys.map(k=>P.byKey[k].chip).join('」「')}」。`; p.msg=null; afterSlotFound(); return; }
  if(ph==='follow'){ const Q=sl.follow; p.think=`這是一句條件，我問自己：${Q.q} 答案是：${Q.o[Q.a]}。我在底線旁邊寫上它管誰。`; p.msg=null; nextSlot(); return; }
  if(ph==='pick'){ p.think=`現在我問自己：${Q4[p.pickT-1]}`; pickQ(p.pickT); p.msg=null; return; }
  if(ph==='noise'){ const N=P.need.noise[p.ni],sx=N.steps[p.ns]; p.ns++; let t=`${sx.q} ${sx.o[sx.a]}。`; if(p.ns>=N.steps.length) t+=' 所以可以劃掉，旁邊寫理由：'+finishNoise(); p.think=t; p.msg=null; return; }
  const A={type:P.typeQ.a,calc:ph==='calc'?P.calc[p.ci].a:0,model:P.model.a,ans:P.ans.a,diag:2}[ph];
  choose(A); p.think=p.msg?p.msg[1]:null;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act, v=b.dataset.v;
  if(a==='ovclose'&&b.classList.contains('ovm')&&e.target.closest('.ovmc')) return;
  if(a==='chk'){ S.paper.chk[v]=b.checked; render(); return; }
  if(a==='ex'){ S.ex=+v; S.pop=false; S.ovd=null; }
  else if(a==='close') S.pop=false;
  else if(a==='ovd') S.ovd=+v;
  else if(a==='ovclose') S.ovd=null;
  else if(a==='mode'){ S.mode[S.ex-1]=v; save(); }
  else if(a==='tap'){ if(!(S.ex>=1&&S.ex<=6)) return; tap(+v); }
  else if(a==='opt') choose(+v);
  else if(a==='pickq') pickQ(+v);
  else if(a==='cand'){ const t=decodeURIComponent(v),p=cur(); p.sel=p.sel.includes(t)?p.sel.filter(x=>x!==t):p.sel.concat(t); }
  else if(a==='candok') candOK();
  else if(a==='demo') demo();
  else if(a==='rev') S.paper.rev++;
  else return;
  if(S.ex>=1&&S.ex<=6){ const p=cur(); if(!p.started){ p.started=true; } }
  render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.ovd!=null){ S.ovd=null; render(); return; } if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chunk[role=button]')){ e.preventDefault(); e.target.click(); } });
fit();
})();

<style>
.ov{align-content:stretch}
.wb-overlay{position:fixed;inset:0;z-index:50}
.wb-overlay #wbCanvas{position:absolute;left:0;top:0;touch-action:none;cursor:crosshair;background:transparent}
.wb-overlay.wb-opaque #wbCanvas{background:#fff}
.wb-overlay.wb-erase #wbCanvas{cursor:cell}
.wb-bar{box-sizing:border-box;position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plate);color:var(--ink);border-radius:12px;box-shadow:0 0 0 2px var(--line),0 8px 24px rgba(0,0,0,.25);
  padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;resize:both;overflow:auto;min-width:260px;min-height:52px;max-width:calc(100vw - 20px);max-height:60vh;font:700 13px var(--f-cn)}
.wb-grip{cursor:grab;font-size:20px;line-height:1;padding:4px 6px;color:var(--ink-3);user-select:none;touch-action:none}
.wb-sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--plate);box-shadow:0 0 0 2px var(--line);padding:0}
.wb-sw.active{box-shadow:0 0 0 3px var(--ink)}
.wb-bar input[type=color]{width:34px;height:30px;border:0;padding:0;background:none}
.wb-bar input[type=range]{width:96px}
.wb-b{height:34px;padding:0 10px;border:0;border-radius:6px;background:var(--road);color:var(--ink);font:800 13.5px var(--f-cn);box-shadow:inset 0 0 0 2px var(--line)}
.wb-b.active{background:var(--warn);color:var(--on-warn);box-shadow:none}
.wb-b.close{background:var(--ink);color:var(--plate);box-shadow:none}
.wb-sep{width:1px;height:26px;background:var(--line)}
</style>
<div class="wb-overlay" id="wbOverlay" hidden>
  <canvas id="wbCanvas"></canvas>
  <div class="wb-bar" id="wbBar" role="toolbar" aria-label="白板工具列">
    <span class="wb-grip" id="wbGrip" title="拖曳移動工具列">⠿</span>
    <button class="wb-sw active" type="button" data-c="#D2231C" style="background:#D2231C" aria-label="紅色"></button>
    <button class="wb-sw" type="button" data-c="#1D5BAA" style="background:#1D5BAA" aria-label="藍色"></button>
    <button class="wb-sw" type="button" data-c="#0B8E59" style="background:#0B8E59" aria-label="綠色"></button>
    <button class="wb-sw" type="button" data-c="#131416" style="background:#131416" aria-label="黑色"></button>
    <button class="wb-sw" type="button" data-c="#F5C300" style="background:#F5C300" aria-label="黃色"></button>
    <input type="color" id="wbColor" value="#D2231C" aria-label="自訂顏色">
    <span class="wb-sep"></span>
    <label for="wbSize">粗細 <span id="wbSizeLbl">4</span></label><input type="range" id="wbSize" min="1" max="40" value="4">
    <span class="wb-sep"></span>
    <button class="wb-b" id="wbErase" type="button">橡皮擦</button>
    <button class="wb-b" id="wbOpaque" type="button">白底：關</button>
    <button class="wb-b" id="wbClear" type="button">全部清除</button>
    <!--SAVE--><button class="wb-b" id="wbSaveLayer" type="button">存標註</button>
    <button class="wb-b" id="wbSaveMerged" type="button">存合併畫面</button><!--/SAVE-->
    <button class="wb-b close" id="wbClose" type="button">關閉白板</button>
  </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ov=$('wbOverlay'), canvas=$('wbCanvas'), ctx=canvas.getContext('2d'), bar=$('wbBar'), tog=$('wbToggleBtn');
let renderScale=Math.min(window.devicePixelRatio||1,2), ready=false, drawing=false, lastX=0, lastY=0;
let color='#D2231C', width=4, eraser=false;
function init(){ if(ready) return; const w=innerWidth,h=innerHeight;
  canvas.width=Math.round(w*renderScale); canvas.height=Math.round(h*renderScale); canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(renderScale,0,0,renderScale,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ready=true; }
function open(on){ if(on) init(); ov.hidden=!on; tog.classList.toggle('on',on); tog.setAttribute('aria-pressed',on); tog.textContent=on?'白板：開':'白板'; }
tog.addEventListener('click',()=>open(ov.hidden));
$('wbClose').addEventListener('click',()=>open(false));
function mode(){ ctx.globalCompositeOperation=eraser?'destination-out':'source-over'; ctx.strokeStyle=color; ctx.lineWidth=width; }
function pos(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(parseFloat(canvas.style.width)/r.width),y:(e.clientY-r.top)*(parseFloat(canvas.style.height)/r.height)}; }
canvas.addEventListener('pointerdown',e=>{ drawing=true; canvas.setPointerCapture(e.pointerId); const p=pos(e); lastX=p.x; lastY=p.y; mode(); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.01,p.y+0.01); ctx.stroke(); e.preventDefault(); });
canvas.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; });
const end=()=>{ drawing=false; }; canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
function setEraser(on){ eraser=on; $('wbErase').classList.toggle('active',on); ov.classList.toggle('wb-erase',on); }
function setColor(c){ color=c; $('wbColor').value=c; bar.querySelectorAll('.wb-sw').forEach(b=>b.classList.toggle('active',b.dataset.c.toLowerCase()===c.toLowerCase())); setEraser(false); }
bar.querySelectorAll('.wb-sw').forEach(b=>b.addEventListener('click',()=>setColor(b.dataset.c)));
$('wbColor').addEventListener('input',e=>setColor(e.target.value));
$('wbSize').addEventListener('input',e=>{ width=+e.target.value; $('wbSizeLbl').textContent=width; });
$('wbErase').addEventListener('click',()=>setEraser(!eraser));
$('wbOpaque').addEventListener('click',()=>{ const on=ov.classList.toggle('wb-opaque'); $('wbOpaque').textContent='白底：'+(on?'開':'關'); $('wbOpaque').classList.toggle('active',on); });
$('wbClear').addEventListener('click',()=>{ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); });
const stamp=()=>{ const d=new Date(),z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; };
function dl(cv,name){ cv.toBlob(b=>{ const u=URL.createObjectURL(b),a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); },'image/png'); }
const sl=$('wbSaveLayer'), sm=$('wbSaveMerged');
if(sl) sl.addEventListener('click',()=>dl(canvas,`白板標註_${stamp()}.png`));
if(sm) sm.addEventListener('click',()=>{ if(typeof html2canvas!=='function') return; sm.disabled=true; sm.textContent='儲存中…'; const saveScale=1;
  html2canvas(document.body,{scale:saveScale,backgroundColor:'#ffffff',useCORS:true,logging:false,ignoreElements:el=>el.id==='wbOverlay'||el.id==='wbToggleBtn',onclone:doc=>{ const st=doc.createElement('style'); st.textContent='*{box-shadow:none!important}.side,.mission,.checkbar,.card,.q4>div,.opt,.qbtn,.cand,.btn.alt,.mini,.sheet{border:2px solid var(--line)}.side.focus,.slot{border:3px solid var(--warn)}.q4>div.on{border:3px solid var(--info)}.opt.no,.qbtn.no{border-color:var(--reg)}.chunk.m-ask,.mk.ask{border:3px solid var(--reg);border-radius:999px}.chunk.m-data,.mk.data{border:2.5px solid var(--tour)}.route{border:3px solid var(--guide-fg)}.leg.on .no{border:3px solid var(--guide-fg)}.rt tr.miss th{border-left:4px solid var(--reg)}.disc{border:6px solid #D2231C}.tile{border:2px solid var(--line)}.chip.c-c{border:1.5px solid var(--info)}'; doc.head.appendChild(st); }}).then(bg=>{
    const m=document.createElement('canvas'); m.width=bg.width; m.height=bg.height; const mc=m.getContext('2d'); mc.drawImage(bg,0,0);
    if(ov.classList.contains('wb-opaque')){ mc.fillStyle='#fff'; mc.fillRect(Math.round(scrollX*saveScale),Math.round(scrollY*saveScale),Math.round(innerWidth*saveScale),Math.round(innerHeight*saveScale)); }
    mc.drawImage(canvas,0,0,canvas.width,canvas.height,Math.round(scrollX*saveScale),Math.round(scrollY*saveScale),Math.round(innerWidth*saveScale),Math.round(innerHeight*saveScale));
    dl(m,`白板合併畫面_${stamp()}.png`); }).catch(()=>{}).finally(()=>{ sm.disabled=false; sm.textContent='存合併畫面'; }); });
/* 工具列拖曳 */
(function(){ const grip=$('wbGrip');
  function down(e){ const t=e.touches&&e.touches[0]; const sx=t?t.clientX:e.clientX, sy=t?t.clientY:e.clientY; const r=bar.getBoundingClientRect(); let moved=false,pinned=false;
    function mv(ev){ const p=(ev.touches&&ev.touches[0])?ev.touches[0]:ev; const dx=p.clientX-sx, dy=p.clientY-sy; if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
      if(moved&&!pinned){ bar.style.width=r.width+'px'; bar.style.height=r.height+'px'; pinned=true; }
      if(!moved) return; const ml=Math.max(0,innerWidth-bar.offsetWidth), mt=Math.max(0,innerHeight-bar.offsetHeight);
      bar.style.left=Math.max(0,Math.min(r.left+dx,ml))+'px'; bar.style.top=Math.max(0,Math.min(r.top+dy,mt))+'px'; bar.style.bottom='auto'; bar.style.transform='none'; ev.preventDefault(); }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); document.addEventListener('touchmove',mv,{passive:false}); document.addEventListener('touchend',up); e.preventDefault(); }
  grip.addEventListener('mousedown',down); grip.addEventListener('touchstart',down,{passive:false}); })();
window.__wb={ctx,canvas,setColor,setEraser};
})();
</script>
